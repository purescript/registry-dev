name: Deploy Dashboard

on:
  push:
    branches: [master]
    paths: ['dashboard/**', '.github/workflows/dashboard.yml']
  pull_request:
    types: [opened, reopened, synchronize, closed]
    paths: ['dashboard/**', '.github/workflows/dashboard.yml']

permissions:
  contents: write
  pull-requests: write

concurrency: pages-${{ github.ref }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: DeterminateSystems/determinate-nix-action@v3
        if: github.event.action != 'closed'

      - uses: DeterminateSystems/magic-nix-cache-action@v14
        if: github.event.action != 'closed'
        with:
          use-flakehub: false

      - name: Build dashboard
        if: github.event.action != 'closed'
        run: nix build .#dashboard --out-link _site

      - name: Deploy to Pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: _site
          clean-exclude: pr-preview

      # On 'closed' events this removes the preview directory from gh-pages;
      # on all other PR events it deploys the build to pr-preview/pr-<number>/.
      - name: Deploy PR preview
        if: github.event_name == 'pull_request'
        uses: rossjrw/pr-preview-action@v1
        with:
          source-dir: ./_site/
